name: patastay_core
description: Shared PataStay code - configuration, Supabase access, models, repositories, theme and widgets.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.5
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  http: ^1.6.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  mocktail: ^1.0.5

flutter:
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
